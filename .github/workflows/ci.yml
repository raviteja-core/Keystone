name: Keystone CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  go-lint:
    name: Go Lint & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Verify Formatting
        run: |
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files require gofmt -s:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.5
          install-mode: goinstall

  go-test:
    name: Go Test (-race)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Start PostgreSQL
        run: |
          docker compose up -d --wait postgres

      - name: Run Database Migrations
        run: go test -v -count=1 ./migrations

      - name: Run Tests with Race Detector
        run: go test -race -v -count=1 -coverprofile=coverage.out ./...

      - name: Teardown Services
        if: always()
        run: docker compose down -v

  go-vuln:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version: '1.26.x'

  java-verify:
    name: Java 25 Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Maven Modules
        run: cd java && mvn -B test

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Auth Server Image
        run: docker build -f deploy/docker/Dockerfile.authserver -t keystone-authserver:ci .

      - name: Build Authz Engine Image
        run: docker build -f deploy/docker/Dockerfile.authz -t keystone-authz:ci .
